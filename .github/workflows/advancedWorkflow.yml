name: first workflow
env:
  WORKFLOW_VAR: "This variable is declared at the workflow level"
on:
  workflow_dispatch:
jobs:
  first_job:
    runs-on: ubuntu-latest
    env:
      JOB_VAR: "This is a job variable"
    steps:
      - name: first_job script
        shell: bash
        run: echo Hello World! This is the first job.
      - name: The checkout action step
        uses: actions/checkout@v6
      - name: Print to Log
        id: print-to-log
        uses: actions/hello-world-javascript-action@main
        with:
          who-to-greet: ${{ github.actor }}
      - name: time
        run: |
          echo "The time of the greeting was at: ${{ steps.print-to-log.outputs.time }}"
  second_job:
    runs-on: ubuntu-latest
    needs: first_job
    steps:
      - name: second_job script
        shell: bash
        run: |
          echo This is the second job 
          echo and this is a multi-line script.
      - name: environment variable
        env:
          STEP_VAR: "This is a step variable"
        run: |
          echo $WORKFLOW_VAR
          echo $JOB_VAR
          echo $STEP_VAR
          echo "The following is a secret: ${{ secrets.ADI_SECRET}} so handle carefully"
          echo "The following are default environment variables:"
          echo $GITHUB_ACTOR
          echo $GITHUB_JOB
          echo $GITHUB_REF
